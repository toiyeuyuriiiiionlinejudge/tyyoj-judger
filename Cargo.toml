[package]
name = "tyyoj-judger"
version = "0.1.0"
edition = "2021"
authors = ["toiyeuyuriiiii & nmkdeveloper"]
license = "MIT"
repository = "https://github.com/toiyeuyuriiiiionlinejudge/tyyoj-judger"
description = "Persistent Judging Worker Daemon for Toi Yêu Yuri Online Judge"

[dependencies]
tyyoj-contracts = { path = "../tyyoj-contracts" }
tokio = { version = "1.54.1", features = ["full"] }
redis = { version = "1.8.1", features = ["tokio-comp", "aio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
