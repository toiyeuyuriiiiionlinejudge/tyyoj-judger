name: Judger & Sandbox CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  rust:
    name: Judger Daemon Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check Formatting
        run: cargo fmt --check
      - name: Clippy Linter
        run: cargo clippy -- -D warnings
      - name: Run Tests
        run: cargo test

  sandbox:
    name: C++ Sandbox Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check C++ Formatting
        run: |
          find src/sandbox -name "*.cpp" -o -name "*.h" -o -name "*.hpp" | xargs -r clang-format --dry-run -Werror
