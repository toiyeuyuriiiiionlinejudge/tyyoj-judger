name: Feature Request
description: Suggest an idea or enhancement for Toi Yêu Yuri Online Judge
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please provide context on the problem and your desired solution.
  - type: input
    id: component
    attributes:
      label: Target Component
      description: e.g. tyyoj-backend, tyyoj-judger, tyyoj-frontend, tyyoj-contracts
      placeholder: tyyoj-backend
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe clearly.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe what you want to happen and how it should work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
    validations:
      required: false
