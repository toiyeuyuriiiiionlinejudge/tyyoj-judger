name: Bug Report
description: Create a report to help us improve Toi Yêu Yuri Online Judge
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below.
  - type: input
    id: component
    attributes:
      label: Affected Component
      description: e.g. tyyoj-backend, tyyoj-judger, tyyoj-frontend, tyyoj-contracts, sandbox
      placeholder: tyyoj-judger
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Submit problem ...
        2. Set judging mode to ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment & Versions
      description: OS, Docker version, browser, submission language, etc.
      placeholder: |
        - OS: Debian 13 (Trixie)
        - Docker: 26.1.5
        - Rust: 1.99.1
        - Node: 26.13.1
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Relevant logs or terminal output.
      render: shell
    validations:
      required: false
